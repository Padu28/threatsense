# ---------------------------------------------------------------
# ThreatSense — feature configuration
# ---------------------------------------------------------------
numeric:
  - duration_ms
  - fwd_packets
  - bwd_packets
  - fwd_bytes
  - bwd_bytes
  - flow_bytes_per_s
  - flow_packets_per_s
  - mean_pkt_size
  - fwd_bwd_byte_ratio
  - syn_flag_count
  - rst_flag_count
  - ack_flag_count
  - iat_mean_ms
  - src_flow_count_60s      # context: flows from the same source in the previous 60 s
  - src_port_diversity_60s  # context: distinct destination ports from the same source (60 s)
  - dst_port_is_wellknown
categorical:
  - protocol
log_transform:
  - duration_ms
  - fwd_packets
  - bwd_packets
  - fwd_bytes
  - bwd_bytes
  - flow_bytes_per_s
  - flow_packets_per_s
  - fwd_bwd_byte_ratio
  - iat_mean_ms
  - src_flow_count_60s
context_window_seconds: 60
