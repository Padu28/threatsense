[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "threatsense"
version = "1.0.0"
description = "Explainable network-flow anomaly detection and streaming security analytics (defensive research prototype)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Padmashree Shah" }]
keywords = ["anomaly-detection", "network-security", "intrusion-detection", "imbalanced-learning", "explainability"]
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "scipy>=1.11",
  "scikit-learn>=1.6",
  "joblib>=1.3",
  "pyyaml>=6.0",
  "matplotlib>=3.8",
]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "pydantic>=2.6"]
dashboard = ["streamlit>=1.46", "plotly>=5.20"]
extras = ["shap>=0.45", "xgboost>=2.0", "mlflow>=2.12"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "httpx>=0.27", "ruff>=0.4", "mypy>=1.9"]

[project.scripts]
threatsense = "threatsense.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B008", "B905"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
